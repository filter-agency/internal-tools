user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Skip the load balancer's health checks (every 15s) in the logs
    map $request_uri $loggable {
        /up     0;
        default 1;
    }
    access_log /dev/stdout combined if=$loggable;
    sendfile on;
    server_tokens off;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Behind the load balancer: client IP and HTTPS come from its headers.
    # Only the load balancer can reach the container (host security group).
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_x_forwarded_proto $forwarded_https {
        https   on;
        default "";
    }

    server {
        listen 80 default_server;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location ^~ /build/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ^~ /vendor/livewire/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTPS $forwarded_https;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
