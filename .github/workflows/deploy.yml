name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Default is 10m, which the pre-deploy backup now eats into. Give the
          # backup's own 600s timeout room to fire first with a clearer error.
          command_timeout: 20m
          script: |
            set -e
            umask 0002
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            cd /var/www/internal.filter.agency

            # Guarantee the site comes back out of maintenance mode even if a
            # step below fails — otherwise a mid-deploy error leaves it 503ing
            # indefinitely, which is worse than the race condition this works
            # around.
            trap 'php artisan up || true' EXIT

            # Take the app down for the whole deploy, not just the cache
            # rebuild. Previously the deploy cleared the compiled view cache
            # and rebuilt it while still serving live traffic: if a request
            # landed in that gap, PHP-FPM (running as www-data) recompiled a
            # view itself and wrote it with permissions the deploy user
            # couldn't later overwrite, failing `artisan view:cache` with
            # "Permission denied". No live requests means no stray
            # www-data-owned cache files.
            #
            # --render pre-renders the 503 page now (as the deploy user) so
            # requests during maintenance are served from the static
            # maintenance file without booting the framework. Without it,
            # every hit while down Blade-compiles errors::503 as www-data,
            # recreating exactly the unwritable cache file this guards
            # against.
            php artisan down --render="errors::503" --retry=60 || true

            # Wait for in-flight jobs before dumping, so the backup is a true
            # point-in-time snapshot rather than one with worker writes landing
            # just after it.
            #
            # `down` above already stops workers reserving new jobs — they pause
            # themselves while the app is in maintenance mode — but a job that was
            # already executing runs to completion and keeps writing. That is the
            # only remaining gap between the dump and `migrate --force`.
            #
            # Also not `|| true`: if the queue will not drain we cannot claim the
            # backup is authoritative, so the deploy must stop. The EXIT trap
            # still brings the site back up on the previous release.
            php artisan queue:await-idle --timeout=180

            # Full database backup before anything can mutate the database.
            #
            # Deliberately NOT `|| true`: if we cannot prove a restore point
            # exists, the deploy must not go on to run `migrate --force`. With
            # `set -e` a failure aborts here, and the EXIT trap above still runs
            # `artisan up`, so a failed backup leaves the site serving the old
            # release rather than stranded in maintenance mode.
            #
            # Placed after `down` so live traffic is not writing rows into the
            # gap between the dump and the migration, and before `git pull` so
            # the snapshot matches the schema we would actually roll back to.
            #
            # `timeout` bounds a hung dump so it fails with an obvious error
            # instead of silently consuming the ssh-action command timeout.
            timeout 600 php artisan backup:run --only-db

            git pull origin main
            composer install --no-dev --no-interaction --optimize-autoloader
            npm ci && npm run build
            php artisan livewire:publish --assets
            sudo -n install -o root -g root -m 0644 /var/www/internal.filter.agency/deploy/nginx/internal.filter.agency.conf /etc/nginx/sites-available/internal.filter.agency
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            php artisan migrate --force
            php artisan view:clear
            mkdir -p storage/framework/views bootstrap/cache
            # Ownership fixes are belt-and-braces: files created by php-fpm
            # (www-data) can't be re-owned by the deploy user, but the setgid
            # dirs already give them the right group. Never fail the deploy
            # on these — a genuine permission problem surfaces loudly in the
            # artisan cache commands below instead.
            chgrp -R www-data storage/framework/views bootstrap/cache || true
            chmod -R ug+rwX storage/framework/views bootstrap/cache || true
            find storage/framework/views -type f -name '*.php' -delete
            find storage/framework/views bootstrap/cache -type d -exec chmod g+s {} + || true
            php artisan config:cache
            php artisan route:cache
            # Retry once after re-clearing: a queue worker finishing a job
            # mid-deploy can still compile a view as www-data in the gap
            # between the delete above and this cache rebuild.
            php artisan view:cache || { find storage/framework/views -type f -name '*.php' -delete; php artisan view:cache; }
            chgrp -R www-data storage/framework/views bootstrap/cache || true
            chmod -R ug+rwX storage/framework/views bootstrap/cache || true
            find storage/framework/views bootstrap/cache -type d -exec chmod g+s {} + || true
            php artisan queue:restart
